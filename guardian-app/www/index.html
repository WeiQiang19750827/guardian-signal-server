<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Guardian v1.104</title>
<meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval'; connect-src * 'unsafe-inline'; script-src * 'unsafe-inline' 'unsafe-eval'; style-src * 'unsafe-inline';">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, sans-serif; background: #0f1923; color: #e0e0e0; padding: 16px; min-height: 100vh; }
.container { max-width: 420px; margin: 0 auto; }
h1 { text-align: center; font-size: 24px; padding: 24px 0 8px; color: #00d4aa; letter-spacing: 3px; }
.subtitle { text-align: center; font-size: 13px; color: #556677; margin-bottom: 24px; }
.card { background: #1a2634; border-radius: 12px; padding: 20px; margin-bottom: 12px; border: 1px solid #2a3a4a; }
input { width: 100%; padding: 14px 16px; background: #0f1923; border: 2px solid #2a3a4a; border-radius: 10px; color: #e0e0e0; font-size: 22px; text-align: center; letter-spacing: 8px; margin-bottom: 12px; font-weight: 600; }
input:focus { outline: none; border-color: #00d4aa; }
.btn { display: inline-block; padding: 14px 24px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; width: 100%; text-align: center; font-weight: 600; }
.btn-primary { background: #00d4aa; color: #0f1923; }
.btn-primary:disabled { background: #2a3a4a; color: #667788; cursor: not-allowed; }
.btn-secondary { background: #2a3a4a; color: #e0e0e0; }
.btn-danger { background: #e74c3c; color: #fff; }
.tab-bar { display: flex; gap: 0; margin-bottom: 16px; border-radius: 10px; overflow: hidden; border: 1px solid #2a3a4a; }
.tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-size: 14px; font-weight: 500; background: #0f1923; color: #556677; transition: all 0.2s; }
.tab.active { background: #1a2634; color: #00d4aa; }
.tab:not(.active):hover { background: #1a2634; color: #8899aa; }
.code-display { text-align: center; font-size: 28px; letter-spacing: 4px; font-weight: 700; color: #00d4aa; padding: 24px 0; font-family: monospace; }
.code-label { text-align: center; color: #8899aa; font-size: 13px; margin-bottom: 4px; }
.code-hint { text-align: center; color: #556677; font-size: 12px; margin-top: 8px; }
.status-bar { padding: 8px 12px; border-radius: 8px; font-size: 13px; text-align: center; margin-bottom: 12px; font-weight: 500; }
.status-idle { background: #1a2634; color: #556677; border: 1px solid #2a3a4a; }
.status-waiting { background: #1a2634; color: #f0ad4e; border: 1px solid #f0ad4e; }
.status-connected { background: #003d2e; color: #00d4aa; border: 1px solid #00d4aa; }
.status-error { background: #3d1a1a; color: #e74c3c; border: 1px solid #e74c3c; }
.hidden { display: none !important; }
.icon-large { font-size: 40px; display: block; text-align: center; padding: 8px 0; }
</style>
</head>
<body>
<div class="container">
  <h1>GUARDIAN</h1>
  <p class="subtitle">两台手机通过配对码安全连接</p>

  <div class="tab-bar" id="tabBar">
    <div class="tab active" data-tab="guardian" onclick="switchTab('guardian')">守护端</div>
    <div class="tab" data-tab="protected" onclick="switchTab('protected')">被守护端</div>
  </div>

  <div id="statusBar" class="status-bar status-idle">准备就绪</div>

  <div id="guardianTab">
    <div class="card">
      <div id="guardianCodeSection">
        <p class="icon-large">&#128737;</p>
        <button class="btn btn-primary" onclick="startGuarding()" id="startGuardBtn">开始守护</button>
      </div>
      <div id="guardianWaitSection" class="hidden">
        <p class="code-label">配对码</p>
        <div class="code-display" id="pairCode">------</div>
        <p class="code-hint">将此配对码告知对方</p>
        <div class="status-bar status-waiting" style="margin-top:12px;">等待对方连接...</div>
        <button class="btn btn-danger" onclick="stopGuard()" id="stopGuardBtn" style="margin-top:12px;">停止守护</button>
      </div>
    </div>
  </div>

  <div id="protectedTab" class="hidden">
    <div class="card">
      <div id="protectedInputSection">
        <p class="icon-large">&#128274;</p>
        <input type="text" id="codeInput" placeholder="输入配对码" maxlength="6" inputmode="numeric">
        <button class="btn btn-primary" onclick="joinGuard()" id="joinBtn">连接</button>
      </div>
      <div id="protectedWaitSection" class="hidden">
        <div class="status-bar status-waiting" style="margin-bottom:0;">正在连接...</div>
        <button class="btn btn-danger" onclick="disconnect()" style="margin-top:12px;">断开</button>
      </div>
    </div>
  </div>

  <div class="card hidden" id="connectedSection">
    <div id="connectedContent">
      <div class="status-bar status-connected">已安全连接</div>
      <p class="text-center" style="color:#8899aa;font-size:13px;">数据传输通道已建立</p>
      <button class="btn btn-danger" onclick="disconnect()" style="margin-top:12px;">断开连接</button>
    </div>
  </div>
</div>

<script src="lib/peerjs.min.js"></script>
<script>
const SERVER_HTTP = 'https://guardian-signal-server-production.up.railway.app';

var state = {
  code: null,
  role: null,
  connected: false,
  pollTimer: null,
  cleanupTimer: null,
};

function $(id) { return document.getElementById(id); }

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelector('.tab[data-tab="' + tab + '"]').classList.add('active');
  $('guardianTab').classList.toggle('hidden', tab !== 'guardian');
  $('protectedTab').classList.toggle('hidden', tab !== 'protected');
  $('connectedSection').classList.add('hidden');
  disconnect();
  setStatus('idle', '准备就绪');
}

function setStatus(type, msg) {
  var el = $('statusBar');
  el.textContent = msg;
  el.className = 'status-bar status-' + type;
}

function startGuarding() {
  $('startGuardBtn').disabled = true;
  $('guardianCodeSection').classList.add('hidden');
  $('guardianWaitSection').classList.remove('hidden');
  $('pairCode').textContent = '------';
  setStatus('waiting', '正在创建配对...');

  fetch(SERVER_HTTP + '/pair', { method: 'POST' }).then(function(r) { return r.json(); }).then(function(data) {
    if (data.code) {
      state.code = data.code;
      state.role = 'guardian';
      $('pairCode').textContent = data.code.split('').join(' ');
      setStatus('waiting', '等待对方输入配对码');
      startPolling(data.code, 'guardian');
    }
  }).catch(function(e) {
    setStatus('error', '创建失败，请检查网络');
    $('guardianCodeSection').classList.remove('hidden');
    $('guardianWaitSection').classList.add('hidden');
    $('startGuardBtn').disabled = false;
  });
}

function joinGuard() {
  var code = $('codeInput').value.trim();
  if (!code || code.length !== 6) {
    setStatus('error', '请输入6位配对码');
    return;
  }
  $('protectedInputSection').classList.add('hidden');
  $('protectedWaitSection').classList.remove('hidden');
  setStatus('waiting', '正在连接...');

  fetch(SERVER_HTTP + '/pair/' + code + '/join', { method: 'POST' }).then(function(r) {
    if (r.status === 404) { throw new Error('配对码无效或已过期'); }
    if (r.status === 400) { throw new Error('该配对码已被使用'); }
    return r.json();
  }).then(function(data) {
    state.code = code;
    state.role = 'protected';
    setStatus('waiting', '配对成功，建立连接...');
    startPolling(code, 'protected');
  }).catch(function(e) {
    setStatus('error', e.message);
    $('protectedInputSection').classList.remove('hidden');
    $('protectedWaitSection').classList.add('hidden');
  });
}

function startPolling(code, role) {
  if (state.pollTimer) clearInterval(state.pollTimer);
  state.pollTimer = setInterval(function() {
    fetch(SERVER_HTTP + '/pair/' + code + '/status').then(function(r) {
      if (r.status === 404) { clearInterval(state.pollTimer); state.pollTimer = null; throw new Error('配对码已过期'); }
      return r.json();
    }).then(function(data) {
      if (data.ready) {
        clearInterval(state.pollTimer);
        state.pollTimer = null;
        if (!state.connected) onConnected();
      } else {
        setStatus('waiting', '等待对方连接...');
      }
    }).catch(function(e) {
      if (state.pollTimer) {
        clearInterval(state.pollTimer);
        state.pollTimer = null;
      }
      if (!state.connected) {
        setStatus('error', e.message);
        resetUI();
      }
    });
  }, 2000);
}

function onConnected() {
  state.connected = true;
  setStatus('connected', '已安全连接');
  $('connectedSection').classList.remove('hidden');
  $('connectedContent').classList.remove('hidden');
  if (state.role === 'guardian') {
    $('guardianWaitSection').classList.add('hidden');
    $('guardianCodeSection').classList.add('hidden');
  } else {
    $('protectedWaitSection').classList.add('hidden');
    $('protectedInputSection').classList.add('hidden');
  }
}

function onDisconnected(msg) {
  state.connected = false;
  setStatus('error', msg || '连接已断开');
  if (state.cleanupTimer) clearTimeout(state.cleanupTimer);
  state.cleanupTimer = setTimeout(function() {
    resetUI();
  }, 3000);
}

function disconnect() {
  state.connected = false;
  if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
  state.code = null;
  state.role = null;
  resetUI();
}

function stopGuard() { disconnect(); }

function resetUI() {
  $('guardianCodeSection').classList.remove('hidden');
  $('guardianWaitSection').classList.add('hidden');
  $('protectedInputSection').classList.remove('hidden');
  $('protectedWaitSection').classList.add('hidden');
  $('connectedSection').classList.add('hidden');
  $('startGuardBtn').disabled = false;
  $('codeInput').value = '';
  setStatus('idle', '准备就绪');
}
</script>
</body>
</html>
