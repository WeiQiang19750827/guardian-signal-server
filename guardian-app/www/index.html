<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Guardian v1.106</title>
<meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval'; connect-src * 'unsafe-inline'; script-src * 'unsafe-inline' 'unsafe-eval'; style-src * 'unsafe-inline';">
<style>
:root {
  --bg: #0a0e17;
  --card: #141b2b;
  --card-hover: #1a2338;
  --border: #1e2a45;
  --primary: #00d4aa;
  --primary-dim: #003d2e;
  --text: #e8eaed;
  --text-dim: #7a8ba3;
  --danger: #ef4444;
  --danger-dim: #2d1515;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 2px 12px rgba(0,0,0,0.3);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); min-height:100vh; overflow-x:hidden; }
.hidden { display:none !important; }

/* ===== Role Selection ===== */
#roleOverlay {
  position:fixed; inset:0; z-index:99999;
  background: linear-gradient(145deg, #0a0e17 0%, #141b2b 100%);
  display:flex; align-items:center; justify-content:center;
  transition: opacity 0.4s ease;
}
.role-box { width:320px; text-align:center; padding:32px 20px; }
.role-box h1 { font-size:28px; color:var(--primary); letter-spacing:6px; margin-bottom:4px; }
.role-box p { font-size:13px; color:var(--text-dim); margin-bottom:28px; }
.role-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.role-card {
  padding:20px 12px; background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius); cursor:pointer;
  transition: all 0.2s;
}
.role-card:active { transform:scale(0.96); }
.role-card .icon { font-size:36px; display:block; margin-bottom:8px; }
.role-card .label { font-size:15px; font-weight:600; margin-bottom:4px; }
.role-card .desc { font-size:10px; color:var(--text-dim); line-height:1.4; }
.role-card.guardian { border-top:3px solid var(--primary); }
.role-card.protected { border-top:3px solid #818cf8; }

/* ===== App Shell ===== */
.app-shell { max-width:420px; margin:0 auto; padding:0 12px 80px; }
.page-header { display:flex; align-items:center; gap:8px; padding:16px 0 12px; }
.back-btn { width:36px; height:36px; border-radius:50%; background:var(--card); border:none; color:var(--text); font-size:18px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.back-btn:active { background:var(--card-hover); }
.page-title { font-size:18px; font-weight:600; flex:1; }

/* ===== Cards ===== */
.card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.card-empty { text-align:center; padding:40px 16px; }
.card-empty .icon { font-size:48px; display:block; margin-bottom:8px; }
.card-empty h3 { font-size:16px; margin-bottom:6px; }
.card-empty p { font-size:13px; color:var(--text-dim); margin-bottom:16px; }

/* ===== Buttons ===== */
.btn { display:flex; align-items:center; justify-content:center; gap:6px; width:100%; padding:14px; border:none; border-radius:var(--radius-sm); font-size:15px; font-weight:600; cursor:pointer; transition:all 0.15s; }
.btn:active { transform:scale(0.97); }
.btn-primary { background:var(--primary); color:#0a0e17; }
.btn-primary:disabled { background:var(--border); color:var(--text-dim); cursor:not-allowed; transform:none; }
.btn-secondary { background:var(--card); color:var(--text); border:1px solid var(--border); }
.btn-danger { background:var(--danger); color:#fff; }

/* ===== Code Display ===== */
.code-display { text-align:center; font-size:32px; letter-spacing:6px; font-weight:700; color:var(--primary); padding:20px 0; font-family:monospace; }
.code-hint { text-align:center; font-size:12px; color:var(--text-dim); }

/* ===== Input ===== */
input, select { width:100%; padding:14px 16px; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text); font-size:16px; outline:none; }
input:focus, select:focus { border-color:var(--primary); }

/* ===== Recipient Types ===== */
.type-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.type-option { padding:16px; background:var(--bg); border:2px solid var(--border); border-radius:var(--radius-sm); text-align:center; cursor:pointer; transition:all 0.15s; }
.type-option:active { transform:scale(0.96); }
.type-option.selected { border-color:var(--primary); background:var(--primary-dim); }
.type-option .emoji { font-size:32px; display:block; margin-bottom:4px; }
.type-option .type-label { font-size:14px; font-weight:500; }

/* ===== Avatar Grid ===== */
.avatar-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:12px 0; }
.avatar-item { aspect-ratio:1; border-radius:50%; background:var(--bg); border:3px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:30px; cursor:pointer; transition:all 0.15s; }
.avatar-item:active { transform:scale(0.9); }
.avatar-item.selected { border-color:var(--primary); background:var(--primary-dim); }

/* ===== Recipient Card (in home) ===== */
.rc { display:flex; align-items:center; gap:14px; padding:14px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:10px; cursor:pointer; transition:all 0.15s; }
.rc:active { background:var(--card-hover); }
.rc-avatar { width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0; }
.rc-info { flex:1; }
.rc-name { font-size:16px; font-weight:600; }
.rc-status { font-size:12px; color:var(--primary); }
.rc-arrow { color:var(--text-dim); font-size:18px; }

/* ===== Bottom Nav ===== */
.bottom-nav { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--border); display:flex; z-index:100; padding:8px 0 env(safe-area-inset-bottom,8px); }
.nav-item { flex:1; text-align:center; font-size:11px; color:var(--text-dim); cursor:pointer; padding:4px 0; transition:all 0.15s; }
.nav-item .nav-icon { font-size:20px; display:block; margin-bottom:2px; }
.nav-item.active { color:var(--primary); }

/* ===== Status Bar ===== */
.status { padding:10px 14px; border-radius:var(--radius-sm); font-size:13px; text-align:center; margin-bottom:12px; font-weight:500; }
.status-idle { background:var(--card); color:var(--text-dim); border:1px solid var(--border); }
.status-waiting { background:#1a1a0a; color:#f0ad4e; border:1px solid #f0ad4e; }
.status-connected { background:var(--primary-dim); color:var(--primary); border:1px solid var(--primary); }
.status-error { background:var(--danger-dim); color:var(--danger); border:1px solid var(--danger); }

/* ===== Emergency Button ===== */
.emergency { display:flex; flex-direction:column; align-items:center; gap:4px; padding:32px; background:linear-gradient(135deg,#2d1515,#1a0e0e); border:2px solid var(--danger); border-radius:var(--radius); cursor:pointer; transition:all 0.15s; margin-bottom:12px; }
.emergency:active { transform:scale(0.96); }
.emergency .icon { font-size:48px; }
.emergency .label { font-size:18px; font-weight:700; color:var(--danger); }
.emergency .hint { font-size:12px; color:var(--text-dim); }

/* ===== Toast ===== */
.toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:99998; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 20px; font-size:14px; box-shadow:var(--shadow); transition:opacity 0.3s; max-width:90%; }
</style>
</head>
<body>

<!-- ===== Role Selection ===== -->
<div id="roleOverlay">
  <div class="role-box">
    <h1>GUARDIAN</h1>
    <p>选择你的身份开始使用</p>
    <div class="role-grid">
      <div class="role-card guardian" onclick="selectRole('guardian')">
        <span class="icon">&#x1F6E1;&#xFE0F;</span>
        <div class="label">监护人</div>
        <div class="desc">守护家人安全<br>查看状态与告警</div>
      </div>
      <div class="role-card protected" onclick="selectRole('protected')">
        <span class="icon">&#x1F3E1;</span>
        <div class="label">被守护者</div>
        <div class="desc">一键紧急求助<br>每日健康打卡</div>
      </div>
    </div>
  </div>
</div>

<!-- ===== Guardian Shell ===== -->
<div id="guardianShell" class="app-shell hidden">
  <!-- Home -->
  <div id="guardianHome" class="page-content">
    <div class="page-header">
      <span style="font-size:24px;font-weight:700;color:var(--primary);letter-spacing:2px;">GUARDIAN</span>
    </div>
    <div id="guardianStatus" class="status status-idle">准备就绪</div>
    <div id="guardianRecipientList"></div>
  </div>

  <!-- Pairing -->
  <div id="guardianPair" class="page-content hidden">
    <div class="page-header">
      <button class="back-btn" onclick="guardianBackHome()">&#x2190;</button>
      <span class="page-title">添加被守护人</span>
    </div>
    <div class="card" style="text-align:center;padding:32px 16px;">
      <div style="font-size:40px;margin-bottom:4px;">&#x1F4CD;</div>
      <div style="font-size:15px;font-weight:600;margin-bottom:4px;">创建配对码</div>
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:16px;">将此配对码告知对方完成连接</div>
      <div class="code-display" id="pairCodeDisplay">------</div>
      <div id="pairWaitHint" class="code-hint">等待对方连接...</div>
      <button class="btn btn-secondary" onclick="guardianCancelPair()" style="margin-top:12px;">取消</button>
    </div>
  </div>

  <!-- Add Recipient Form -->
  <div id="guardianAddForm" class="page-content hidden">
    <div class="page-header">
      <button class="back-btn" onclick="guardianBackHome()">&#x2190;</button>
      <span class="page-title">设置被守护人</span>
    </div>
    <div class="card">
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:12px;">选择类型</div>
      <div class="type-grid" id="typeGrid">
        <div class="type-option selected" data-type="elder" onclick="selectType(this)">
          <span class="emoji">&#x1F474;</span>
          <span class="type-label">老人</span>
        </div>
        <div class="type-option" data-type="child" onclick="selectType(this)">
          <span class="emoji">&#x1F476;</span>
          <span class="type-label">儿童</span>
        </div>
      </div>
      <div style="font-size:13px;color:var(--text-dim);margin:12px 0 8px;">选择头像</div>
      <div class="avatar-grid" id="addAvatarGrid"></div>
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:8px;">称呼</div>
      <input type="text" id="recipientNameInput" placeholder="如：妈妈、爷爷" maxlength="10">
      <button class="btn btn-primary" onclick="saveRecipient()" id="saveRecipientBtn" style="margin-top:16px;" disabled>完成</button>
    </div>
  </div>

  <!-- Recipient Detail -->
  <div id="guardianDetail" class="page-content hidden">
    <div class="page-header">
      <button class="back-btn" onclick="showGuardianHome()">&#x2190;</button>
      <span class="page-title" id="detailTitle">详情</span>
    </div>
    <div id="detailContent"></div>
  </div>

  <!-- Settings -->
  <div id="guardianSettings" class="page-content hidden">
    <div class="page-header">
      <span class="page-title">设置</span>
    </div>
    <div class="card">
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:8px;">服务器</div>
      <div style="font-size:14px;">guardian-signal-server-production.up.railway.app</div>
    </div>
    <button class="btn btn-danger" onclick="disconnectAll()">断开所有连接</button>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav" id="guardianNav">
    <div class="nav-item active" data-nav="home" onclick="guardianNav('home')">
      <span class="nav-icon">&#x1F3E0;</span>
      <span>首页</span>
    </div>
    <div class="nav-item" data-nav="settings" onclick="guardianNav('settings')">
      <span class="nav-icon">&#x2699;&#xFE0F;</span>
      <span>设置</span>
    </div>
  </div>
</div>

<!-- ===== Protected Shell ===== -->
<div id="protectedShell" class="app-shell hidden">
  <!-- Pair Input -->
  <div id="protectedPair" class="page-content">
    <div class="page-header">
      <span style="font-size:24px;font-weight:700;color:#818cf8;letter-spacing:2px;">GUARDIAN</span>
    </div>
    <div id="protectedStatus" class="status status-idle">准备就绪</div>
    <div class="card">
      <p style="text-align:center;font-size:13px;color:var(--text-dim);margin-bottom:12px;">输入监护人分享的6位配对码</p>
      <input type="text" id="protectedCodeInput" placeholder="输入配对码" maxlength="6" inputmode="numeric">
      <button class="btn btn-primary" onclick="joinPair()" id="joinPairBtn" style="margin-top:12px;">连接</button>
    </div>
  </div>

  <!-- Protected Home (Post-Connection) -->
  <div id="protectedHome" class="page-content hidden">
    <div class="page-header">
      <span style="font-size:22px;font-weight:700;color:#818cf8;letter-spacing:1px;">已连接</span>
    </div>
    <div class="status status-connected">已安全连接</div>
    <div class="emergency" onclick="triggerEmergency()">
      <span class="icon">&#x1F6A8;</span>
      <span class="label">紧急求助</span>
      <span class="hint">点击立即通知监护人</span>
    </div>
    <div class="card">
      <div style="font-size:14px;color:var(--text-dim);margin-bottom:4px;">连接状态</div>
      <div style="font-size:14px;"><span style="color:var(--primary);">&#x25CF;</span> 已建立安全通道</div>
    </div>
    <button class="btn btn-danger" onclick="disconnectAll()" style="margin-top:12px;">断开连接</button>
  </div>
</div>

<!-- ===== Toast ===== -->
<div id="toast" class="toast hidden"></div>

<script>
var SERVER_HTTP = 'https://guardian-signal-server-production.up.railway.app';
var AVATARS = ['\uD83D\uDC74','\uD83D\uDC76','\uD83D\uDC68','\uD83D\uDC69','\uD83D\uDC68\u200D\uD83E\uDDB3','\uD83D\uDC69\u200D\uD83E\uDDB3','\uD83D\uDC74\u200D\u2640\uFE0F','\uD83D\uDC75\u200D\u2642\uFE0F'];
var TYPE_EMOJI = { elder:'\uD83D\uDC74', child:'\uD83D\uDC76' };

var state = {
  code: null, role: null, connected: false,
  pollTimer: null
};

var appData = { role: null, recipients: [] };

function $(id) { return document.getElementById(id); }
function show(id) { var e = $(id); if(e) e.classList.remove('hidden'); }
function hide(id) { var e = $(id); if(e) e.classList.add('hidden'); }

function loadData() {
  try { var d = localStorage.getItem('guardian_data'); if(d) { var p = JSON.parse(d); if(p.recipients) appData.recipients = p.recipients; } } catch(e) {}
}
function saveData() {
  try { localStorage.setItem('guardian_data', JSON.stringify({ recipients: appData.recipients })); } catch(e) {}
}
loadData();

function toast(msg) {
  var t = $('toast'); t.innerHTML = msg; t.classList.remove('hidden');
  setTimeout(function(){ t.classList.add('hidden'); }, 2500);
}

/* ===== Role Selection ===== */
function selectRole(role) {
  appData.role = role;
  var overlay = $('roleOverlay');
  overlay.style.opacity = '0';
  setTimeout(function(){
    overlay.style.display = 'none';
    if (role === 'guardian') {
      show('guardianShell'); hide('protectedShell');
      initGuardianAvatars(); renderGuardianHome();
    } else {
      show('protectedShell'); hide('guardianShell');
    }
  }, 300);
}

/* ===== Guardian: Init ===== */
function initGuardianAvatars() {
  var grid = $('addAvatarGrid'); if (!grid) return;
  grid.innerHTML = '';
  AVATARS.forEach(function(e){
    var d = document.createElement('div');
    d.className = 'avatar-item'; d.innerHTML = e; d.dataset.emoji = e;
    d.onclick = function(){
      document.querySelectorAll('#addAvatarGrid .avatar-item').forEach(function(x){ x.classList.remove('selected'); });
      d.classList.add('selected');
    };
    grid.appendChild(d);
  });
}

var selectedType = 'elder';

function selectType(el) {
  document.querySelectorAll('.type-option').forEach(function(x){ x.classList.remove('selected'); });
  el.classList.add('selected');
  selectedType = el.dataset.type;
}

/* ===== Guardian: Home ===== */
function renderGuardianHome() {
  var list = $('guardianRecipientList');
  var data = appData.recipients;
  if (!data || data.length === 0) {
    list.innerHTML =
      '<div class="card card-empty">' +
      '<span class="icon">&#x1F9CD;</span>' +
      '<h3>暂无被守护人</h3>' +
      '<p>添加被守护人后，你可以随时查看他们的状态</p>' +
      '<button class="btn btn-primary" onclick="startPair()">&#x2795; 添加被守护人</button>' +
      '</div>';
    return;
  }
  var html = '<button class="btn btn-primary" onclick="startPair()" style="margin-bottom:12px;">&#x2795; 添加被守护人</button>';
  data.forEach(function(r, i){
    var emoji = r.avatar || TYPE_EMOJI[r.type] || '\uD83D\uDC74';
    html += '<div class="rc" onclick="showDetail(' + i + ')">' +
      '<div class="rc-avatar" style="background:' + (r.type==='child'?'#f59e0b33':'#10b98133') + '">' + emoji + '</div>' +
      '<div class="rc-info"><div class="rc-name">' + r.name + '</div>' +
      '<div class="rc-status">' + (r.type==='child'?'\u513F\u7AE5':'\u8001\u4EBA') + ' \u2022 \u5DF2\u8FDE\u63A5</div></div>' +
      '<span class="rc-arrow">\u203A</span></div>';
  });
  list.innerHTML = html;
}

/* ===== Guardian: Pairing ===== */
function startPair() {
  hide('guardianHome'); hide('guardianAddForm'); hide('guardianDetail'); hide('guardianSettings');
  show('guardianPair');
  $('pairCodeDisplay').textContent = '------';
  $('pairWaitHint').textContent = '正在创建配对...';

  fetch(SERVER_HTTP + '/pair', { method:'POST' }).then(function(r){ return r.json(); }).then(function(data){
    if (data.code) {
      state.code = data.code; state.role = 'guardian';
      $('pairCodeDisplay').textContent = data.code.split('').join(' ');
      $('pairWaitHint').textContent = '等待对方输入配对码';
      startPolling(data.code, 'guardian', function onReady(){
        hide('guardianPair'); show('guardianAddForm');
        selectedType = 'elder';
        document.querySelectorAll('.type-option').forEach(function(x,i){ x.classList.toggle('selected',i===0); });
        $('recipientNameInput').value = '';
        document.querySelectorAll('#addAvatarGrid .avatar-item').forEach(function(x){ x.classList.remove('selected'); });
        $('saveRecipientBtn').disabled = true;
        setGuardianStatus('waiting', '请填写被守护人信息');
      });
      setGuardianStatus('waiting', '配对码已生成');
    }
  }).catch(function(){
    toast('创建失败，请检查网络');
    guardianBackHome();
  });
}

function guardianCancelPair() {
  cleanupPoll(); guardianBackHome();
}

/* ===== Guardian: Save Recipient ===== */
$('recipientNameInput').oninput = function(){
  var name = this.value.trim();
  var avatar = document.querySelector('#addAvatarGrid .avatar-item.selected');
  $('saveRecipientBtn').disabled = !(name && avatar);
};

function saveRecipient() {
  var name = $('recipientNameInput').value.trim();
  var avatarEl = document.querySelector('#addAvatarGrid .avatar-item.selected');
  if (!name || !avatarEl) return;
  var avatar = avatarEl.dataset.emoji;
  appData.recipients.push({ name: name, type: selectedType, avatar: avatar, addedAt: Date.now() });
  saveData();
  toast('\u2705 \u5DF2\u6DFB\u52A0 ' + name);
  showGuardianHome();
}

/* ===== Guardian: Detail ===== */
function showDetail(index) {
  var r = appData.recipients[index];
  if (!r) return;
  $('detailTitle').textContent = r.name;
  var emoji = r.avatar || TYPE_EMOJI[r.type] || '\uD83D\uDC74';
  $('detailContent').innerHTML =
    '<div class="card" style="text-align:center;padding:24px;">' +
    '<div style="width:72px;height:72px;border-radius:50%;background:' + (r.type==='child'?'#f59e0b33':'#10b98133') + ';display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 12px;">' + emoji + '</div>' +
    '<div style="font-size:20px;font-weight:700;">' + r.name + '</div>' +
    '<div style="font-size:13px;color:var(--text-dim);margin-top:4px;">' + (r.type==='child'?'儿童':'老人') + '</div></div>' +
    '<div class="card"><div style="font-size:13px;color:var(--text-dim);margin-bottom:8px;">连接状态</div>' +
    '<div style="font-size:14px;"><span style="color:var(--primary);">&#x25CF;</span> 已建立安全通道</div></div>' +
    '<button class="btn btn-danger" onclick="removeRecipient(' + index + ')">删除 ' + r.name + '</button>';
  hide('guardianHome'); hide('guardianPair'); hide('guardianAddForm'); hide('guardianSettings');
  show('guardianDetail');
}

function removeRecipient(index) {
  appData.recipients.splice(index, 1);
  saveData();
  showGuardianHome();
}

/* ===== Guardian: Navigation ===== */
function guardianBackHome() { cleanupPoll(); showGuardianHome(); }

function showGuardianHome() {
  hide('guardianPair'); hide('guardianAddForm'); hide('guardianDetail'); hide('guardianSettings');
  show('guardianHome');
  renderGuardianHome();
  setGuardianStatus('idle', '准备就绪');
  document.querySelectorAll('#guardianNav .nav-item').forEach(function(x){ x.classList.toggle('active', x.dataset.nav==='home'); });
}

function guardianNav(tab) {
  document.querySelectorAll('#guardianNav .nav-item').forEach(function(x){ x.classList.toggle('active', x.dataset.nav===tab); });
  if (tab === 'home') showGuardianHome();
  else { hide('guardianHome'); hide('guardianPair'); hide('guardianAddForm'); hide('guardianDetail'); show('guardianSettings'); }
}

function setGuardianStatus(type, msg) {
  var el = $('guardianStatus');
  if (el) { el.textContent = msg; el.className = 'status status-' + type; }
}

/* ===== Protected: Pair & Connect ===== */
function joinPair() {
  var code = $('protectedCodeInput').value.trim();
  if (!code || code.length !== 6) { toast('请输入6位配对码'); return; }
  $('joinPairBtn').disabled = true;
  setProtectedStatus('waiting', '正在连接...');

  fetch(SERVER_HTTP + '/pair/' + code + '/join', { method:'POST' }).then(function(r){
    if (r.status === 404) throw new Error('配对码无效或已过期');
    if (r.status === 400) throw new Error('该配对码已被使用');
    return r.json();
  }).then(function(){
    state.code = code; state.role = 'protected';
    setProtectedStatus('waiting', '配对成功，正在确认...');
    startPolling(code, 'protected', function onReady(){
      hide('protectedPair'); show('protectedHome');
      setProtectedStatus('connected', '已安全连接');
      $('joinPairBtn').disabled = false;
    });
  }).catch(function(e){
    setProtectedStatus('error', e.message);
    $('joinPairBtn').disabled = false;
  });
}

function setProtectedStatus(type, msg) {
  var el = $('protectedStatus');
  if (el) { el.textContent = msg; el.className = 'status status-' + type; }
}

/* ===== Common: Polling ===== */
function startPolling(code, role, onReady) {
  cleanupPoll();
  state.pollTimer = setInterval(function(){
    fetch(SERVER_HTTP + '/pair/' + code + '/status').then(function(r){
      if (r.status === 404) { cleanupPoll(); throw new Error('配对码已过期'); }
      return r.json();
    }).then(function(data){
      if (data.ready) {
        cleanupPoll();
        if (!state.connected) { state.connected = true; onReady(); }
      }
    }).catch(function(){
      cleanupPoll();
      if (!state.connected) {
        if (role === 'guardian') { toast('连接失败'); guardianBackHome(); }
        else { toast('连接失败'); $('joinPairBtn').disabled = false; }
      }
    });
  }, 2000);
}

function cleanupPoll() {
  if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
}

/* ===== Common: Disconnect ===== */
function disconnectAll() {
  state.connected = false; cleanupPoll();
  state.code = null; state.role = null;
  if (appData.role === 'guardian') showGuardianHome();
  else {
    hide('protectedHome'); show('protectedPair');
    $('protectedCodeInput').value = '';
    $('joinPairBtn').disabled = false;
    setProtectedStatus('idle', '准备就绪');
  }
}

/* ===== Protected: Emergency ===== */
function triggerEmergency() {
  toast('\uD83D\uDEA8 \u7D27\u6025\u6C42\u52A9\u5DF2\u53D1\u9001\uFF01');
}
</script>
